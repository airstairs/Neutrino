<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>Futurama Starry Sky</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        /* Planet Express Erase Button */
        .ship-erase-btn {
            pointer-events: auto;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            -webkit-tap-highlight-color: transparent;
        }
        .ship-erase-btn:active {
            transform: scale(0.85) rotate(-5deg);
        }
        .ship-svg {
            width: 85px;
            height: 55px;
            filter: drop-shadow(0px 0px 8px rgba(78, 205, 196, 0.8));
        }
        .btn-label {
            color: #4edcc4;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 6px rgba(78, 220, 196, 0.9), 0 0 12px rgba(0,0,0,0.8);
            margin-top: 2px;
        }
        #hint {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 230, 150, 0.6);
            font-size: 12px;
            letter-spacing: 1px;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 0 4px rgba(0,0,0,0.8);
        }
    </style>
    <!-- Three.js CDN -->
    <script src="three.min.js"></script>
    <!-- Cannon.js CDN -->
    <script src="cannon.min.js"></script>
</head>
<body>

    <div id="hint">XOXOXOXOX</div>
    <div id="canvas-container"></div>

    <div id="ui-layer">
        <button class="ship-erase-btn" id="eraseBtn" title="Erase All Stars">
            <!-- Planet Express Ship SVG -->
            <svg class="ship-svg" viewBox="0 0 160 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="shipHull" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#7be3c3" />
                        <stop offset="60%" stop-color="#3fa88e" />
                        <stop offset="100%" stop-color="#1c5e4f" />
                    </linearGradient>
                    <linearGradient id="shipRed" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ff4b4b" />
                        <stop offset="100%" stop-color="#9e1b1b" />
                    </linearGradient>
                    <radialGradient id="glowExhaust" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#00ffff" />
                        <stop offset="100%" stop-color="#00ffff" stop-opacity="0" />
                    </radialGradient>
                </defs>
                <!-- Tail Flame Glow -->
                <ellipse cx="22" cy="50" rx="18" ry="10" fill="url(#glowExhaust)" />
                <polygon points="30,44 10,50 30,56" fill="#00ffff" opacity="0.9" />
                
                <!-- Main Fuselage Body -->
                <path d="M 30,50 Q 55,25 105,32 Q 145,40 152,50 Q 145,60 105,68 Q 55,75 30,50 Z" fill="url(#shipHull)" stroke="#0f382f" stroke-width="2.5"/>
                
                <!-- Red Stripe -->
                <path d="M 50,42 Q 90,38 135,46 Q 130,52 90,52 Q 50,52 50,42 Z" fill="url(#shipRed)" />
                
                <!-- Cabin / Cockpit Top Bubble -->
                <path d="M 80,33 Q 100,18 120,33 Z" fill="#2d7a67" stroke="#0f382f" stroke-width="2"/>
                <path d="M 85,33 Q 100,22 115,33 Z" fill="#9bf5ff" opacity="0.8"/>
                
                <!-- Porthole Windows -->
                <circle cx="65" cy="50" r="4" fill="#88f0ff" stroke="#0f382f" stroke-width="1.5"/>
                <circle cx="80" cy="50" r="4" fill="#88f0ff" stroke="#0f382f" stroke-width="1.5"/>
                <circle cx="95" cy="50" r="4" fill="#88f0ff" stroke="#0f382f" stroke-width="1.5"/>
                
                <!-- Top Fin -->
                <path d="M 45,34 L 30,12 L 58,28 Z" fill="url(#shipRed)" stroke="#0f382f" stroke-width="2"/>
                <!-- Bottom Landing Fin -->
                <path d="M 50,65 L 38,85 L 65,69 Z" fill="url(#shipHull)" stroke="#0f382f" stroke-width="2"/>
            </svg>
            <span class="btn-label">ERASE</span>
        </button>
    </div>

    <script>
        const STORAGE_KEY = 'futurama_star_constellation_v5';

        function generateStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            const cx = 64, cy = 64;
            
            let grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 64);
            grad.addColorStop(0.0, 'rgba(255, 255, 240, 1.0)');
            grad.addColorStop(0.15, 'rgba(255, 215, 90, 0.95)');
            grad.addColorStop(0.4, 'rgba(255, 150, 20, 0.5)');
            grad.addColorStop(0.7, 'rgba(200, 80, 0, 0.15)');
            grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, 64, 0, Math.PI * 2);
            ctx.fill();

            let coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 20);
            coreGrad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
            coreGrad.addColorStop(0.5, 'rgba(255, 240, 180, 0.9)');
            coreGrad.addColorStop(1, 'rgba(255, 200, 80, 0)');

            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.arc(cx, cy, 20, 0, Math.PI * 2);
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        function updateCameraPosition() {
            const aspect = window.innerWidth / window.innerHeight;
            if (aspect < 0.55) {
                camera.position.z = 26;
            } else if (aspect < 0.8) {
                camera.position.z = 22;
            } else {
                camera.position.z = 18;
            }
        }
        updateCameraPosition();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const world = new CANNON.World();
        world.gravity.set(0, 0, 0);

        const nebulaUniforms = {
            uTime: { value: 0.0 },
            uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        };

        const nebulaMaterial = new THREE.ShaderMaterial({
            uniforms: nebulaUniforms,
            depthWrite: false,
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform vec2 uResolution;
                varying vec2 vUv;

                float hash(vec2 p) {
                    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
                }

                float noise(vec2 p) {
                    vec2 i = floor(p);
                    vec2 f = fract(p);
                    vec2 u = f * f * (3.0 - 2.0 * f);
                    return mix(mix(hash(i + vec2(0.0,0.0)), hash(i + vec2(1.0,0.0)), u.x),
                               mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
                }

                float fbm(vec2 p) {
                    float v = 0.0;
                    float a = 0.5;
                    vec2 shift = vec2(100.0);
                    mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));
                    for (int i = 0; i < 4; ++i) {
                        v += a * noise(p);
                        p = rot * p * 2.0 + shift;
                        a *= 0.5;
                    }
                    return v;
                }

                void main() {
                    vec2 st = gl_FragCoord.xy / uResolution.xy;
                    st.x *= uResolution.x / uResolution.y;

                    vec2 q = vec2(0.0);
                    q.x = fbm(st + 0.05 * uTime);
                    q.y = fbm(st + vec2(1.0));

                    vec2 r = vec2(0.0);
                    r.x = fbm(st + 1.0 * q + vec2(1.7, 9.2) + 0.15 * uTime);
                    r.y = fbm(st + 1.0 * q + vec2(8.3, 2.8) + 0.126 * uTime);

                    float f = fbm(st + r);

                    vec3 color = mix(vec3(0.01, 0.01, 0.05), vec3(0.08, 0.02, 0.15), clamp(f * f * 4.0, 0.0, 1.0));
                    color = mix(color, vec3(0.02, 0.2, 0.25), clamp(length(q), 0.0, 1.0));
                    color = mix(color, vec3(0.4, 0.05, 0.3), clamp(length(r.x), 0.0, 1.0));

                    float starHash = hash(gl_FragCoord.xy * 0.1);
                    if (starHash > 0.997) {
                        float twinkle = sin(uTime * 3.0 + starHash * 100.0) * 0.5 + 0.5;
                        color += vec3(0.8, 0.9, 1.0) * twinkle * 0.8;
                    }

                    gl_FragColor = vec4(color, 1.0);
                }
            `
        });

        const nebulaQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), nebulaMaterial);
        scene.add(nebulaQuad);

        const starTexture = generateStarTexture();
        const starGeometry = new THREE.PlaneGeometry(1.0, 1.0);
        const starMaterial = new THREE.MeshBasicMaterial({
            map: starTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const starObjects = []; 
        let starPositionsData = [];

        function createStarMeshAndBody(x, y) {
            const mesh = new THREE.Mesh(starGeometry, starMaterial);
            mesh.position.set(x, y, 0);
            scene.add(mesh);

            const shape = new CANNON.Sphere(0.35);
            const body = new CANNON.Body({
                mass: 0.1,
                linearDamping: 0.9,
                angularDamping: 0.9
            });
            body.addShape(shape);
            body.position.set(x, y, 0);
            world.addBody(body);

            starObjects.push({
                mesh: mesh,
                body: body,
                initialX: x,
                initialY: y,
                floatOffset: Math.random() * Math.PI * 2
            });
        }

        function addStar(x, y, save = true) {
            for (let i = 0; i < starObjects.length; i++) {
                const dx = starObjects[i].initialX - x;
                const dy = starObjects[i].initialY - y;
                if (dx * dx + dy * dy < 0.15) return;
            }

            createStarMeshAndBody(x, y);
            starPositionsData.push({ x: Number(x.toFixed(2)), y: Number(y.toFixed(2)) });

            if (save) {
                saveStarsToStorage();
            }
        }

        function clearAllStars() {
            for (let s of starObjects) {
                scene.remove(s.mesh);
                world.remove(s.body);
            }
            starObjects.length = 0;
            starPositionsData = [];
            if (window.localStorage) {
                window.localStorage.removeItem(STORAGE_KEY);
            }
        }

        function saveStarsToStorage() {
            try {
                if (window.localStorage) {
                    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(starPositionsData));
                }
            } catch (e) {
                console.warn('LocalStorage save failed:', e);
            }
        }

        function loadDefaultMessage() {
            const letterPoints = [];

            function addDot(x, y) {
                letterPoints.push({ x: x, y: y });
            }

            function addLine(x1, y1, x2, y2, steps = 4) {
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    addDot(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t);
                }
            }

            function addCircleO(centerX, centerY, radius = 0.9, numDots = 8) {
                for (let i = 0; i < numDots; i++) {
                    const angle = (i / numDots) * Math.PI * 2;
                    addDot(centerX + Math.cos(angle) * radius, centerY + Math.sin(angle) * radius);
                }
            }

            // ROW 1: "I"
            const y1 = 8.2;
            addLine(-0.8, y1 + 1.0, 0.8, y1 + 1.0, 3);
            addLine(0, y1 + 1.0, 0, y1 - 1.0, 4);
            addLine(-0.8, y1 - 1.0, 0.8, y1 - 1.0, 3);

            // ROW 2: "LOVE YOU,"
            const y2 = 1.8;
            const s2 = 0.65;

            let ox = -5.2;
            addLine(ox, y2 + 1.5*s2, ox, y2 - 1.5*s2, 4);
            addLine(ox, y2 - 1.5*s2, ox + 1.1*s2, y2 - 1.5*s2, 2);

            ox = -3.4;
            addCircleO(ox + 0.5*s2, y2, 1.0 * s2, 8);

            ox = -1.6;
            addLine(ox, y2 + 1.5*s2, ox + 0.6*s2, y2 - 1.5*s2, 4);
            addLine(ox + 0.6*s2, y2 - 1.5*s2, ox + 1.2*s2, y2 + 1.5*s2, 4);

            ox = 0.1;
            addLine(ox, y2 + 1.5*s2, ox, y2 - 1.5*s2, 4);
            addLine(ox, y2 + 1.5*s2, ox + 1.0*s2, y2 + 1.5*s2, 2);
            addLine(ox, y2, ox + 0.8*s2, y2, 2);
            addLine(ox, y2 - 1.5*s2, ox + 1.0*s2, y2 - 1.5*s2, 2);

            ox = 2.0;
            addLine(ox, y2 + 1.5*s2, ox + 0.6*s2, y2, 2);
            addLine(ox + 1.2*s2, y2 + 1.5*s2, ox + 0.6*s2, y2, 2);
            addLine(ox + 0.6*s2, y2, ox + 0.6*s2, y2 - 1.5*s2, 2);

            ox = 3.6;
            addCircleO(ox + 0.5*s2, y2, 1.0 * s2, 8);

            ox = 5.3;
            addLine(ox, y2 + 1.5*s2, ox, y2 - 1.5*s2, 4);
            addLine(ox, y2 - 1.5*s2, ox + 1.1*s2, y2 - 1.5*s2, 2);
            addLine(ox + 1.1*s2, y2 - 1.5*s2, ox + 1.1*s2, y2 + 1.5*s2, 4);

            addDot(6.8, y2 - 1.2*s2);
            addDot(6.65, y2 - 1.7*s2);
            addDot(6.45, y2 - 2.2*s2);
            addDot(6.2, y2 - 2.7*s2);

            const row2OffsetX = -0.6;
            for (let pt of letterPoints) {
                if (pt.y > -0.5 && pt.y < 4.5) {
                    pt.x += row2OffsetX;
                }
            }

            // ROW 3: "LEELA"
            const y3 = -4.5;
            const s3 = 0.8;

            ox = -4.0;
            addLine(ox, y3 + 1.6*s3, ox, y3 - 1.6*s3, 4);
            addLine(ox, y3 - 1.6*s3, ox + 1.3*s3, y3 - 1.6*s3, 3);

            ox = -2.1;
            addLine(ox, y3 + 1.6*s3, ox, y3 - 1.6*s3, 4);
            addLine(ox, y3 + 1.6*s3, ox + 1.2*s3, y3 + 1.6*s3, 2);
            addLine(ox, y3, ox + 0.9*s3, y3, 2);
            addLine(ox, y3 - 1.6*s3, ox + 1.2*s3, y3 - 1.6*s3, 2);

            ox = -0.3;
            addLine(ox, y3 + 1.6*s3, ox, y3 - 1.6*s3, 4);
            addLine(ox, y3 + 1.6*s3, ox + 1.2*s3, y3 + 1.6*s3, 2);
            addLine(ox, y3, ox + 0.9*s3, y3, 2);
            addLine(ox, y3 - 1.6*s3, ox + 1.2*s3, y3 - 1.6*s3, 2);

            ox = 1.5;
            addLine(ox, y3 + 1.6*s3, ox, y3 - 1.6*s3, 4);
            addLine(ox, y3 - 1.6*s3, ox + 1.3*s3, y3 - 1.6*s3, 3);

            ox = 3.3;
            addLine(ox, y3 - 1.6*s3, ox + 0.8*s3, y3 + 1.6*s3, 4);
            addLine(ox + 0.8*s3, y3 + 1.6*s3, ox + 1.6*s3, y3 - 1.6*s3, 4);
            addLine(ox + 0.35*s3, y3 - 0.4*s3, ox + 1.25*s3, y3 - 0.4*s3, 2);

            for (let pt of letterPoints) {
                addStar(pt.x, pt.y, false);
            }
            saveStarsToStorage();
        }

        function initStars() {
            let saved = null;
            try {
                if (window.localStorage) {
                    saved = window.localStorage.getItem(STORAGE_KEY);
                }
            } catch (e) {
                console.warn('LocalStorage read failed:', e);
            }

            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        for (let pt of parsed) {
                            addStar(pt.x, pt.y, false);
                        }
                        return;
                    }
                } catch (e) {
                    console.error('Failed to parse saved stars:', e);
                }
            }
            loadDefaultMessage();
        }

        const raycaster = new THREE.Raycaster();
        const touchVec = new THREE.Vector2();
        const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        const planeIntersectPoint = new THREE.Vector3();

        let isDrawing = false;

        function getIntersectionPoint(clientX, clientY) {
            touchVec.x = (clientX / window.innerWidth) * 2 - 1;
            touchVec.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(touchVec, camera);
            raycaster.ray.intersectPlane(planeZ, planeIntersectPoint);
            return planeIntersectPoint;
        }

        function onPointerDown(e) {
            if (e.target.closest('#ui-layer')) return;
            isDrawing = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const pt = getIntersectionPoint(clientX, clientY);
            addStar(pt.x, pt.y, true);
        }

        function onPointerMove(e) {
            if (!isDrawing) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const pt = getIntersectionPoint(clientX, clientY);
            addStar(pt.x, pt.y, true);
        }

        function onPointerUp() {
            isDrawing = false;
        }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        window.addEventListener('touchstart', onPointerDown, { passive: false });
        window.addEventListener('touchmove', onPointerMove, { passive: false });
        window.addEventListener('touchend', onPointerUp);

        document.getElementById('eraseBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            clearAllStars();
        });

        function handleResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            updateCameraPosition();
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
            nebulaUniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', () => {
            setTimeout(handleResize, 100);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            nebulaUniforms.uTime.value = elapsedTime;
            world.step(1 / 60);

            for (let i = 0; i < starObjects.length; i++) {
                const s = starObjects[i];
                
                const targetX = s.initialX + Math.sin(elapsedTime * 1.5 + s.floatOffset) * 0.12;
                const targetY = s.initialY + Math.cos(elapsedTime * 1.2 + s.floatOffset) * 0.12;

                s.body.position.x += (targetX - s.body.position.x) * 0.1;
                s.body.position.y += (targetY - s.body.position.y) * 0.1;

                s.mesh.position.x = s.body.position.x;
                s.mesh.position.y = s.body.position.y;

                const scale = 1.0 + Math.sin(elapsedTime * 3.0 + s.floatOffset) * 0.15;
                s.mesh.scale.set(scale, scale, 1.0);
            }

            renderer.render(scene, camera);
        }

        initStars();
        animate();
    </script>
</body>
</html>
